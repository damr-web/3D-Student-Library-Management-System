      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bgGrad)" rx="12"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.4" rx="8"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#9d4edd" stroke-width="2" stroke-opacity="0.3" rx="6"/>
